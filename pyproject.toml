[project]
name = "agent-service"
version = "0.1.0"
description = "FastAPI sibling of ai-agent-demo: the same Claude tool-calling agent loop, built with a production-style Python stack."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langchain>=1.4",
    "langchain-anthropic>=1.7",
    # Postgres + pgvector: the knowledge base's vector store (and, from milestone 2, app state).
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "alembic>=1.13",
    # langchain/knowledge_base.py's semantic search — local embeddings (sentence-transformers).
    #
    # Pinned versions below are load-bearing, not arbitrary: on an Intel Mac, PyPI only ships torch
    # up to 2.2.2 (Apple dropped x86_64 macOS wheels after that), and sentence-transformers>=4 requires
    # torch>=2.5 — so >=4 silently fails to import at runtime rather than failing to install. numpy<2 /
    # scipy<1.13 / scikit-learn<1.5 are pinned down the same chain: torch==2.2.2's C extensions were
    # built against NumPy 1.x's ABI, and a bare numpy>=2 install (e.g. a transitive pull) crashes
    # it. This combination is verified working; loosen it only after testing on the target machine.
    "sentence-transformers>=3.4,<4",
    "numpy<2",
    "scipy<1.13",
    "scikit-learn<1.5",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "ruff>=0.7",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agent_service.langchain" = ["kb_articles/*.md"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "evals", "migrations"]
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 110
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
